# M06 가맹점·브랜드 정규화 사전
# 카드·은행 적요(merchant_raw)를 표준 브랜드와 카테고리로 바꾼다.
# 매칭: 공백·기호를 지운 소문자 문자열에 patterns 중 하나가 포함되면 해당 브랜드 (위에서부터 먼저 맞는 것)
# tags: 파생 지표가 쓰는 표시
#   delivery_app(F01) convenience(F02) taxi(F03) cafe(F04) transit(F08) transit_wide(F08 광역)
#   subscription(정기결제·F07, M03 program 과 연결) online_shop(F09) grocery
# carbon_point: 탄소중립포인트 참여 브랜드 여부. 공식 참여사 목록을 확인하기 전까지 null (F04는 null이면 혜택을 계산하지 않음)
# 변경은 PR + 2인 리뷰. 새 가맹점은 LLM 제안 → 사용자 확인 → 여기에 추가 (3-2 탭 거래 처리 규칙)

version: 2026-11-24
categories: [배달, 카페, 편의점, 택시, 대중교통, 구독, 온라인쇼핑, 장보기, 통신, 주거, 운동, 가전·디지털, 경조사, 기타]

