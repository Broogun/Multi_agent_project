# P3 — 29세 직장인 5년차, 경기 본가에서 서울로 장거리 출퇴근 (난이도 Lv2)
#
# 얽힌 문제: 전세 자금 적금(월 70만 원)이 필요 월 저축액보다 모자란다. 가장 큰 지출 지렛대는 야근 택시인데,
# 막차가 끊긴 뒤라 줄이기보다 회사 경비 청구(돌려받기)가 맞는 해법이다. 휴대폰은 약정이 곧 끝나
# 단말 할부가 빠지고(조언 효과 아님) 요금제 비교 여지가 생긴다. 야근 날 배달도 있다.
# 제약: 막차 뒤 귀가(안전), PT는 허리 때문에 계속하고 싶다(보호).
# 함정: 신용카드 대금 출금, PT 3개월 할부(결제는 1건), 연간 결제의 첫 등장(새 월 구독이 아님), 생활비 이체.
#
# 입력 경로 B 가정. 가맹점·기관·앱 이름과 금액은 모두 가상의 데모 값이다.

