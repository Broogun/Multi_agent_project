# ---------------------------------------------------------------- 숨은 사실 (내역만으로는 알 수 없음 → 추가 질의의 정답)
[[hidden_facts]]
id = "H1"
topic = "금요일 결제 뒤에 들어오는 소액 입금"
fact = "동아리 총무라 회식비를 대표 결제하고 부원들에게 1/n 정산을 받는다. 안 보내는 사람도 있다."
answer = "아 그거 동아리 회식이에요. 제가 총무라 먼저 내고 애들이 보내줘요. 가끔 안 주는 애도 있고요."

[[hidden_facts]]
id = "H2"
topic = "10일 입금이 줄어듦"
fact = "카페가 10월부터 평일 오후 타임을 줄여서 근무가 주 3회에서 주 1~2회로 줄었다. 12월도 비슷하다."
answer = "가게가 평일 오후 타임을 없애서 알바를 덜 하게 됐어요."

[[hidden_facts]]
id = "H3"
topic = "11일 10만 원 출금"
