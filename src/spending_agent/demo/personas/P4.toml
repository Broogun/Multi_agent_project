# P4 — 24세 대학생, 자취, 카페 알바, 동아리 총무 (난이도 Lv3)
#
# 얽힌 문제: 목표(노트북)까지 월 17만 원 정도가 모자란다. 가장 큰 원인은 알바 시간 감소(수입)이고,
# 지출 쪽 절약 후보(배달·편의점·못 받은 회식 정산·생필품)는 하나하나가 작다. 그래서 수입·지출·목표 세 방향을
# 함께 봐야 하고, 후보마다 제약(피곤함, 좁은 방, 잔액 10만 원대, 보호 지출인 동아리)이 걸려 있다.
# 자세한 구조는 아래 [[problems]].
# 함정: 동아리 대표 결제 + 정산 입금(더치페이), 이름 없는 이체, 앱 자동 분류 오류, 현금.
#
# 기간 중 (12/15~1/31, docs/10 §8): 12/18 종강총회 대표 결제(미정산 3명), 12/23 월세가 모자라 부모님 추가 송금
# (이름 없는 입금, 일회성), 방학에 알바 시간이 늘어 1/8 알바비 회복(원인 해소 = 제안 효과 아님).
# 12/14까지는 처음 만든 그대로다.
#
# 입력 경로 B 가정: 자산관리 앱에 은행·카드·간편결제를 모두 연결해 두었고, 그 앱의 통합 내역을 내보내 올린다.
# 가맹점·기관·앱 이름과 금액은 모두 가상의 데모 값이다. 실제 가격·요금이 아니다.
# 형식 설명: docs/02-specs.md "통합 거래내역 형식", 실행: python -m spending_agent.demo

id = "P4"
user_id = "demo_P4"
seed = 6                 # 1~20 중 9~11월 변동지출이 고른 표본 (지출은 비슷하고 수입이 줄어드는 구조)
d0 = 2026-12-01          # 온보딩 날. 이전 3개월(9~11월)이 한 번에 적재된다
history_months = 3
live_days = 62           # 운영: 12/1 ~ 1/31 (처음 2주는 시연용 원래 데이터, 이후는 평가용 추가)

[profile]                # 설명용 (생성에 쓰지 않음)
gender = "여"
age = 24
occupation = "대학생 4학년"
housing = "자취 (원룸 월세)"
summary = "카페 알바와 부모님 용돈으로 생활. 동아리 총무라 회식비를 자주 대표 결제한다."

[sync]
late_hour = 22           # 이 시각 이후 거래는 다음 날 들어온다

# ---------------------------------------------------------------- 연결된 계좌·카드 (결제수단 열에 나오는 이름)
[accounts.bank]
label = "데모은행 입출금"
opening_balance = 180000   # "돈이 자꾸 모자라요": 10월 말 잔액이 10만 원대까지 내려간다

[accounts.card]
label = "데모카드 체크"
kind = "체크"            # 체크카드: 결제 즉시 계좌에서 빠진다 (카드대금 없음)

[accounts.easypay]
label = "다람페이"
money_label = "다람머니"
opening_balance = 0
min_charge = 30000       # 머니가 모자라면 계좌에서 3만 원 이상 자동 충전

