id = "H10"
topic = "12/23 20만 원 입금"
fact = "12월 알바비가 적어서 월세가 모자랐다. 엄마한테 부탁해서 20만 원을 더 받았다. 또 부탁하기는 미안하다."
answer = "월세가 모자라서 엄마한테 부탁했어요... 또 그러긴 좀 미안해요."

[[hidden_facts]]
id = "H11"
topic = "방학 알바 시간"
fact = "방학(12/19~)부터 사장님이 주말 오픈 타임을 줘서 다시 주 3회 일한다. 2월 개강 전까지다."
answer = "방학이라 주말 오픈 타임을 받았어요. 2월까진 주 3번 해요."

[[hidden_facts]]
id = "H12"
topic = "1월에도 11일 적금 출금이 없음"
fact = "알바비가 늘었지만 12월에 엄마한테 받은 게 마음에 걸려 통장에 남겨 두고 있다. 2월 월세까지 버틸 수 있을지 걱정된다."
answer = "엄마한테 받은 것도 있고 해서 일단 통장에 두고 있어요. 2월 월세가 걱정돼서요."

[[hidden_facts]]
id = "H13"
topic = "알바 끝난 날 배달·편의점"
fact = "알바 끝난 날은 너무 피곤해서 배달이나 편의점으로 때운다. 알바 없는 날엔 라면이나 계란밥 같은 간단한 건 해 먹을 수 있다."
answer = "알바 끝나면 너무 피곤해서요... 알바 없는 날엔 간단한 건 해 먹을 수 있어요."

