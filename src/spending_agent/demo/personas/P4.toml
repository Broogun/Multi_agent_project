target = { words = ["노트북", "목표"] }
facts = ["H8"]
accept = [{ action = "목표 조정", max_deadline = 2027-03-15 }]   # 금액은 낮춰도 된다 (상태 좋은 중고, H8)
reject = [{ action = "목표 조정", why = "H8: 졸업작품 때문에 3월 중순까지는 꼭 있어야 한다" }]
effect = { goal = true }

[[responses]]
id = "laptop_saving"
target = { words = ["적금", "저축", "떼어"] }
