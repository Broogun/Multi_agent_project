answer = "노트북 적금이요. 11월엔 돈이 없어서 못 넣었어요."

[[hidden_facts]]
id = "H4"
topic = "1일 입금, 25일 출금"
fact = "1일 35만 원은 부모님 용돈, 25일 40만 원은 집주인에게 보내는 월세."
answer = "1일은 부모님이 보내주시는 용돈이고 25일은 월세예요."

[[hidden_facts]]
