pharmacy = { name = "연희바른약국", card_name = "연희바른약국", app_category = ["의료·건강", "약국"] }
dinner_a = { name = "고기굽는날 신촌점", card_name = "고기굽는날신촌", app_category = ["식비", "외식"] }
dinner_b = { name = "치킨창고 연세로점", card_name = "(주)치킨창고연세로", app_category = ["식비", "외식"] }
