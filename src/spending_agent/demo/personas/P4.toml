# ---------------------------------------------------------------- 반응 규칙 (서비스 있음 세계, docs/10 §4, 초안)
# 피드백의 제안(대상·행동·강도)에 반응한다. 기준 세계에는 쓰이지 않는다. 형식: spending_agent.demo.responses, 예시는 P1.toml
# 규칙에 없는 대상·행동은 '보류'로 아무것도 바뀌지 않는다.
# 수락: 회식비 미리 걷기(H9), 배달 2주에 한 번·편의점 주 1회 줄이기(H13), 목표 시점 3월 중순까지 미루기(H8),
# 알바비가 회복된 뒤 노트북 적금 5만 원(H12). 거절: 동아리 줄이기(보호), 직접 정산 독촉(H9), 요리로 바꾸기(H13),
# 대용량 구매(H6), 알바 늘리기(H2·H11), 부모님께 더 받기(H10).
[[responses]]
id = "club"
target = { merchants = ["dinner_a", "dinner_b", "dinner_c"], words = ["회식", "정산", "동아리", "총무"] }
facts = ["H1", "H9"]
accept = [{ action = "바꾸기", to = ["미리", "먼저 걷", "선결제", "사전"] }]
reject = [
  { action = "줄이기", protected = true, why = "보호 지출: 동아리 활동은 줄이지 않는다" },
  { action = "끊기", protected = true, why = "보호 지출: 동아리 활동은 줄이지 않는다" },
  { action = "정산 받기", why = "H9: 부원에게 직접 달라고 하기는 불편하다" },
]
effect = { club = "prepaid" }   # 회식 전에 미리 걷으면 못 받는 정산이 없어진다

[[responses]]
id = "delivery"
target = { merchants = ["delivery"], words = ["배달"] }
facts = ["H13"]
accept = [{ action = "줄이기", max_per_week = 0.5 }]
reject = [
  { action = "줄이기", why = "H13: 알바 없는 날만 해 먹을 수 있다" },
  { action = "끊기", why = "H13: 알바 끝난 날은 너무 피곤하다" },
  { action = "바꾸기", to = ["요리", "집밥", "식재료", "장보기"], why = "H13: 피곤한 날 요리는 못 한다" },
]
effect = [{ habit = "delivery" }, { habit = "mart", factor = 1.2 }]   # 해 먹는 날만큼 마트 장보기가 조금 는다 (가정)
hold_days = 21
keep_after = 0.5

[[responses]]
id = "convenience"
target = { merchants = ["conv_a", "conv_b"], words = ["편의점"] }
facts = ["H13"]
accept = [{ action = "줄이기", max_per_week = 1 }]
reject = [
  { action = "줄이기", why = "H13: 알바 끝난 날은 편의점으로 때워야 한다" },
  { action = "끊기", why = "H13: 알바 끝난 날은 너무 피곤하다" },
]
effect = { habit = "conv" }
hold_days = 21
keep_after = 0.5

[[responses]]
id = "mart_bulk"
target = { merchants = ["mart"], words = ["생필품", "대용량"] }
facts = ["H6"]
reject = [{ action = "바꾸기", to = ["대용량", "묶음", "박스", "한꺼번에"], why = "H6: 방이 좁아 큰 묶음은 둘 곳이 없다" }]

[[responses]]
