# P2 — 21세 대학생 2학년, 본가 (난이도 Lv2)
#
# 얽힌 문제: 방학 여행비를 모으려면 월 15만 원이 필요하다. 카페 지출이 가장 크지만 '커피값'과 '공부할 곳'이
# 섞여 있고, 10월 급증은 시험기간 때문이다(11월은 시험 없이도 높음 = 실제 증가). 집커피 대안은
# 구매비용 비교(사용자 확인 가격)로 이어지는 순서 있는 작업이다. 편의점·게임 소액 결제도 함께 본다.
# 월 여유는 있지만 필요액보다 작아서, 여유를 먼저 떼어 두고 모자란 만큼만 지출로 채워야 한다.
# 제약: 집에서는 공부가 안 된다, 캡슐머신이 없고 드립은 귀찮다, 게임은 본인이 정한 월 상한이 있다.
# 함정: 시험기간 일시 급증을 추세로 보는 것, 이름 없는 용돈·알바 입금.
#
# 기간 중 (12/15~1/31, docs/10 §8): 12/19 방학 시작(카페·교통·학식 감소 = 제안 효과 아님, PC방·모임 증가),
# 12월 말 게임 이벤트로 본인 상한 초과, 1/7 여행 예약 결제(목표를 위해 쓴 돈). 12/14까지는 처음 만든 그대로다.
#
# 입력 경로 B 가정. 가맹점·기관·앱 이름과 금액은 모두 가상의 데모 값이다.

