# P5 — 26세 신입 4개월 차, 원룸 월세 (난이도 Lv3)
#
# 얽힌 문제: 비상금 목표에 월 40만 원대가 필요한데 저축 습관이 아직 없다. 월급 직후 쇼핑이 몰리고(반품이 잦아
# 결제 총액과 순지출 차이가 큼), 배달도 잦다. 노트북 12개월 할부는 줄일 수 없는 고정 지출이라 여유를 줄인다.
# 해지했다고 생각한 구독이 계속 결제된다. 지출 지렛대는 쇼핑·배달을 전부 끊어야 겨우 필요액에 닿는 크기라
# 현실적이지 않다. 그래서 '월급날 먼저 떼어 두기'와 목표 시점 조정(목표 쪽)을 함께 봐야 한다.
# 제약: 금요일 친구들과 한잔은 지키고 싶다(보호), 첫 직장 스트레스 풀이로 쇼핑을 한다.
# 함정: 반품 취소 행, 노트북 할부(9월 1건 전액), 신용카드 대금 출금, 이름 없는 월세·부모님 용돈 이체.
#
# 기간 중 (12/15~1/31, docs/10 §8): 12/25 월급 직후 쇼핑 재발, 12월 부모님 용돈을 건너뜀(지출 감소처럼 보이는 함정),
# 1/12 카드값이 커서 잔액 바닥. 12/14까지는 처음 만든 그대로다.
#
# 입력 경로 B 가정. 가맹점·기관·앱 이름과 금액은 모두 가상의 데모 값이다.

