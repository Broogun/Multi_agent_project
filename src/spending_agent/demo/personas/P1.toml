# ---------------------------------------------------------------- 자기 기록 효과 (앱만 써도 생기는 변화, docs/10 §3, 크기는 가정)
# 피드백의 제안과 상관없이, 기록하고 목표를 확인하는 것만으로 생기는 변화. ② 앱만 / ③ 앱 + 피드백 세계에 같이 들어간다.
# ratio 는 '중간' 크기다. 평가에서는 크기 배율(없음 0 · 작게 0.5 · 중간 1)을 바꿔 가며 LLM 순위가 같은지 본다.
[[self_effects]]
id = "delivery_records"
trigger = { records = ["배달"], count = 3, window_days = 14 }
effect = { habits = ["delivery"], ratio = 0.2 }
hold_days = 14
keep_after = 0.0         # 2주 지나면 원래대로
why = "배달을 자주 기록하다 보면 스스로 의식하게 된다 (R3 '여행 가려면 좀 줄여야 하나')"

[[self_effects]]
id = "goal_behind"
trigger = { goal_behind = true }
effect = { habits = ["delivery", "brunch", "conv"], ratio = 0.1 }
hold_days = 31
keep_after = 0.0
why = "말일에 앱에서 이번 달 목표에 못 미친 것을 보면 다음 달 군것질·외식을 조금 아낀다"

