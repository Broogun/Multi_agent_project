# ---------------------------------------------------------------- 반응 규칙 (서비스 있음 세계, docs/10 §4, 초안)
# 피드백의 제안(대상·행동·강도)에 반응한다. 기준 세계(서비스 없음)에는 쓰이지 않는다. 형식: spending_agent.demo.responses
# 규칙에 없는 대상·행동(예: 구름드라이브 해지, 옷장마켓 줄이기, 외식 줄이기)은 '보류'로 아무것도 바뀌지 않는다.
# 수락: 해지할 만한 구독 3개(월 26,300원), 주말 배달 줄이기, 적금 늘리기. 거절: 보호 지출과 숨은 사실에 걸리는 제안.
[[responses]]
id = "cancel_movieon"
target = { merchants = ["ott_a"] }
facts = ["H2"]
accept = [{ action = "해지" }]
effect = { monthly = "ott_a", change = "stop" }

[[responses]]
id = "cancel_sorirang"
target = { merchants = ["music_a"] }
facts = ["H3"]
accept = [{ action = "해지" }]
effect = { monthly = "music_a", change = "stop" }

[[responses]]
id = "cancel_webtoon"
target = { merchants = ["webtoon"] }
facts = ["H4"]
accept = [{ action = "해지" }]
effect = { monthly = "webtoon", change = "stop" }

[[responses]]
id = "keep_cinebox"
target = { merchants = ["ott_b"] }
protected = true         # 고정 답변의 지키고 싶은 소비
facts = ["H2"]
reject = [{ action = "*", why = "보호 지출: 보는 드라마가 있어서 계속 쓴다" }]

[[responses]]
id = "keep_melody"
target = { merchants = ["music_b"] }
facts = ["H3"]
reject = [{ action = "*", why = "H3: 지금 쓰는 음악 앱이다 (옮겨 간 쪽)" }]

[[responses]]
id = "delivery"
target = { merchants = ["delivery"], words = ["배달"] }
facts = ["H6"]
accept = [{ action = "줄이기", max_per_week = 1 }]   # H6: 토요일 저녁 한 번 정도 = 주 1회 (주간 1.87회 → 0.87회)
reject = [
  { action = "줄이기", why = "H6: 일주일에 한 번 정도까지만 줄일 수 있다" },
  { action = "끊기", why = "H6: 평일에 지쳐서 주말엔 요리하기 싫다" },
  { action = "바꾸기", why = "H6: 주말엔 요리하기 싫다 (집밥·도시락으로 바꾸기)" },
]
effect = { habit = "delivery" }   # 주 n회 줄임 = 빈도 × (1 − n / 주간 빈도)
start_days = 1
hold_days = 21
keep_after = 0.5         # 3주 뒤에는 줄인 폭의 절반만 남는다 (재발)

[[responses]]
id = "saving_up"
target = { words = ["적금", "저축"] }
facts = ["H5", "H10"]
accept = [{ action = "저축 늘리기", max_amount = 50000 }]
reject = [{ action = "저축 늘리기", why = "H10: 월 5만 원 넘게 늘리면 생활비가 빠듯하다" }]
effect = { monthly = "saving", change = "add" }   # 저축 이체는 내 돈의 이동이라 절약액에는 안 잡힌다

