# P1 — 27세 직장인 3년차, 오피스텔 월세 (난이도 Lv1)
#
# 얽힌 문제: 여행 적금(월 20만 원)이 필요 월 저축액보다 조금 모자란다. 구독 중복·가격 인상·무료체험 전환은
# 분명하지만 작고, 주말 배달이 더 크다. 구독 정리만으로는 모자라 주말 배달 조정을 함께 봐야 한다.
# 제약: 씨네박스는 유지하고 싶다(보호), 평일에 지쳐 주말 하루는 편하게 쉬고 싶다.
# 함정: 가족결합 통신비를 대표 결제하고 가족이 1/n 을 보내준다, 신용카드 대금 출금(결제와 이중으로 보임).
#
# 기간 중 (12/15~1/31, docs/10 §8): 12월 하순 연말 모임 몰림(1월엔 원래대로 = 제안 효과 아님),
# 1월 보험료 인상(갱신형), 1/16 축의금(이름 없는 출금). 12/14까지의 거래·기록은 처음 만든 그대로다.
#
# 입력 경로 B 가정: 자산관리 앱에 은행·카드·간편결제를 모두 연결해 두었고, 그 앱의 통합 내역을 내보내 올린다.
# 가맹점·기관·앱 이름과 금액은 모두 가상의 데모 값이다. 실제 가격·요금이 아니다.

