[project]
name = "spending-agent"
version = "0.1.0"
description = "목표 지향 소비 관리 에이전트 협업 기반"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# 제공자 검토용 실험 (scripts/gemini_sdk_experiment.py). 설치: uv sync --group experiment
experiment = ["google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spending_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 외부 API를 부르는 테스트 (CI 제외, 키 필요)"]

[tool.ruff]
line-length = 120
target-version = "py312"
